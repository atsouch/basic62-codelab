<style>
:root {
  --bg: #EEF2F7; --panel: #FFFFFF; --panel2: #F7F9FC; --ink: #1B2430; --muted: #5B6778; --line: #D8DEE8; --line2: #E7EBF2;
  --brand: #00AAB5; --brand-ink: #007780; --brand-soft: #E3F6F7;
  --accent: #2750D8; --accent-ink: #1B3DAF; --accent-soft: #E6ECFD; --hi: #FFE58A; --hi-soft: #FFF6CC;
  --ok: #1F8A4C; --ok-soft: #E3F4EA; --bad: #C8372D; --bad-soft: #FBE9E7; --warn: #A86A12; --warn-soft: #FDF3DF;
  --kw: #2750D8; --str: #1F7A45; --num: #B4461B; --com: #7A8594; --bi: #7C3AED; --cls: #0E7490;
  --ui: 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --code: 'Fira Code', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  --lh: 21px; --fs: 14px; --radius: 8px;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--ui); font-size: 15px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
code, .mono { font-family: var(--code); font-size: 0.92em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); } .small { font-size: 13px; } .grow { flex: 1; }
[hidden] { display: none !important; }

#app { display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto; height: 100%; }
.appbar { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line); box-shadow: inset 0 3px 0 var(--brand); flex-wrap: wrap; }
.brand { display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; padding: 2px 4px 2px 0; cursor: pointer; border-radius: 8px; }
.brand:hover .wordmark { color: var(--brand-ink); }
.brand .logo { height: 32px; width: auto; display: block; }
.brand .icon { display: none; height: 30px; width: 30px; }
.brand .wordmark { font-weight: 700; font-size: 17px; color: var(--ink); padding-left: 9px; border-left: 2px solid var(--brand); line-height: 1.1; }
.credits { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 16px; padding: 0 16px 8px; font-size: 12px; color: var(--muted); }
.credits a { color: var(--brand-ink); font-weight: 700; }
.credits .linkbtn { font-size: 12px; }
.aboutBox { border-top: 4px solid var(--brand); margin: -16px -18px 0; padding: 16px 18px 0; }
.aboutBox .aboutLogo { height: 48px; width: auto; display: block; margin: 4px 0 6px; }
.aboutBox h2 { margin: 0; font-size: 22px; }
.aboutBox .lead { font-size: 15.5px; }
.aboutBox .sub { margin: 2px 0 2px; font-weight: 700; display: block; }
.aboutBox .tag { color: var(--muted); margin: 0 0 12px; }
.aboutBox dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 12px 0; }
.aboutBox dt { color: var(--muted); } .aboutBox dd { margin: 0; font-weight: 700; }
.aboutBox p { margin: 8px 0; max-width: 64ch; }
.aboutBox .fine { font-size: 13px; color: var(--muted); }
.projname { border: 1px solid transparent; background: transparent; padding: 5px 8px; border-radius: 6px; font-weight: 700; font-size: 16px; min-width: 120px; flex: 1 1 180px; max-width: 320px; text-overflow: ellipsis; }
.projname:hover, .projname:focus { border-color: var(--line); background: var(--panel2); }
.menus { display: flex; gap: 2px; }
.edition { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg { border: 0; background: var(--panel); padding: 5px 10px; cursor: pointer; font-weight: 700; font-size: 13px; color: var(--muted); }
.seg[aria-pressed="true"] { background: var(--ink); color: #fff; }
.runbar { display: flex; gap: 6px; margin-left: auto; }
.status { font-size: 13px; color: var(--muted); min-width: 0; white-space: nowrap; text-align: right; }
.status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--muted); vertical-align: 1px; }
.status.running .dot { background: var(--accent); animation: pulse 1s infinite; }
.status.paused .dot { background: var(--warn); } .status.error .dot { background: var(--bad); } .status.done .dot { background: var(--ok); }
@keyframes pulse { 50% { opacity: .3; } }

.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 6px 12px; cursor: pointer; font-size: 14px; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: #B9C3D3; background: var(--panel2); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
.btn.primary:hover:not(:disabled) { background: var(--accent-ink); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover:not(:disabled) { background: var(--panel2); border-color: var(--line); }
.btn.tiny { padding: 2px 8px; font-size: 12.5px; border-radius: 6px; }
.btn.danger { color: var(--bad); }
.btn .ic { font-size: 12px; }
.chip { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; background: var(--panel2); border: 1px solid var(--line); color: var(--muted); }
.chip.ok { background: var(--ok-soft); border-color: #BFE3CD; color: var(--ok); } .chip.bad { background: var(--bad-soft); border-color: #F1C4BE; color: var(--bad); }
.chip.warn { background: var(--warn-soft); border-color: #F0D9AD; color: var(--warn); } .chip.acc { background: var(--accent-soft); border-color: #C9D5FA; color: var(--accent-ink); }

.work { display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr); gap: 10px; padding: 10px 14px 0; min-height: 0; }
.editorPane, .stagePane { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.paneHead, .consoleHead { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-bottom: 1px solid var(--line2); font-size: 13px; color: var(--muted); }

/* editor */

.gl.errl { color: var(--bad); font-weight: 600; }
.codeArea { position: relative; margin-left: var(--gw, 52px); }
.hl, .ta { font-family: var(--code); font-size: var(--fs); line-height: var(--lh); padding: 0 16px 60px 10px; margin: 0; white-space: pre; tab-size: 4; font-variant-ligatures: common-ligatures; }
.hl { position: relative; pointer-events: none; color: var(--ink); min-height: 100%; }
.hl .row { height: var(--lh); position: relative; }
.hl .row.cur { background: var(--hi); box-shadow: inset 3px 0 0 #E0B400; }
.hl .row.errl { background: var(--bad-soft); }
.hl .row.errl .t-err, .hl .row.errl > span:first-child { text-decoration: underline wavy var(--bad); text-underline-offset: 4px; }
.hl .row.cov { background: #EAF6EF; } .hl .row.nocov { background: #FDF0EE; }
.hl .row.caret { background: #F2F5FB; }
.hl .row.cur.caret { background: var(--hi); }

.ta::selection { background: rgba(39, 80, 216, .22); color: transparent; }
.t-kw { color: var(--kw); font-weight: 600; } .t-str { color: var(--str); } .t-num { color: var(--num); } .t-com { color: var(--com); font-style: italic; }
.t-bi { color: var(--bi); } .t-doc { color: #52617A; background: #F1F4FA; } .t-cls { color: var(--cls); font-weight: 500; } .t-bad { color: var(--bad); text-decoration: underline wavy; }
.helpbar { min-height: 30px; padding: 5px 10px; border-top: 1px solid var(--line2); font-size: 13px; color: var(--muted); background: var(--panel2); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.helpbar code { color: var(--ink); }

/* stage */
.stagePane { overflow: auto; }
.widgets { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line2); background: var(--panel2); }
.widgets .w-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.widgets input[type=text], .widgets input[type=number], .widgets select { border: 1px solid #B9C3D3; border-radius: 6px; padding: 6px 8px; background: #fff; min-width: 180px; }
.widgets button { border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 6px; padding: 6px 14px; cursor: pointer; font-weight: 700; }
.widgets button:disabled { opacity: .5; }
.widgets label.w-label { font-size: 15px; }
.canvasWrap { position: relative; width: 100%; max-width: 600px; margin: 10px auto 0; aspect-ratio: 3 / 2; flex: none; }

.console { flex: 1; min-height: 120px; overflow: auto; padding: 8px 12px 16px; font-family: var(--code); font-size: 13.5px; line-height: 1.55; }
.console .o { white-space: pre-wrap; word-break: break-word; }

.console .ask { display: flex; gap: 8px; align-items: center; margin: 4px 0; flex-wrap: wrap; }

.console .err .eh { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.console .err .code { font-family: var(--code); font-size: 12px; color: var(--bad); }
.console .err .why { margin-top: 6px; color: #5A2A25; }

.console .done { color: var(--muted); font-family: var(--ui); font-size: 12.5px; margin-top: 6px; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; font: inherit; }

table.data th, table.data td { border: 1px solid var(--line); padding: 2px 8px; text-align: left; vertical-align: top; }

table.data td.n { text-align: right; } table.data td.miss { background: var(--warn-soft); color: var(--warn); }
.tblWrap { overflow-x: auto; max-width: 100%; }

/* dock */
.dock { margin: 10px 14px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); display: flex; flex-direction: column; height: 36vh; min-height: 160px; overflow: hidden; }
.dock.tall { height: 58vh; } .dock.short { height: 44px; }
.tabs { display: flex; align-items: center; gap: 2px; padding: 4px 8px 0; border-bottom: 1px solid var(--line); overflow-x: auto; flex: none; }
.tabs [role=tab] { border: 0; background: none; padding: 7px 12px 8px; cursor: pointer; font-weight: 700; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; font-size: 14px; }
.tabs [role=tab][aria-selected=true] { color: var(--ink); border-bottom-color: var(--brand); }
.tabs .badge { margin-left: 6px; }
.tabBody { flex: 1; min-height: 0; overflow: auto; padding: 10px 14px; }
.sub { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 10px; align-items: center; }
.sub .seg2 { border: 1px solid var(--line); background: var(--panel); padding: 3px 10px; border-radius: 99px; cursor: pointer; font-size: 13px; }
.sub .seg2[aria-pressed=true] { background: var(--ink); color: #fff; border-color: var(--ink); }
.cols { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 14px; }

.plan td:nth-child(1) { min-width: 120px; } .plan td:nth-child(2) { min-width: 110px; } .plan td:nth-child(5) { min-width: 150px; }
.canvasWrap.off { display: none; }
.canvasToggle { margin-left: auto; }
.box { border: 1px solid var(--line2); border-radius: 7px; padding: 8px 10px; background: var(--panel); }
.box h4, .tabBody h3 { margin: 0 0 6px; font-size: 14px; }
.empty { color: var(--muted); font-size: 14px; padding: 10px 0; }
.toolbar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.toolbar .sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
.toolbar label { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }

/* variables */
.frame { border: 1px solid var(--line2); border-radius: 7px; margin-bottom: 8px; overflow: hidden; }
.frame > .fh { display: flex; justify-content: space-between; padding: 4px 10px; background: var(--panel2); font-size: 13px; font-weight: 700; }
.frame.top > .fh { background: var(--hi-soft); }
.vrow { display: grid; grid-template-columns: 130px 110px minmax(0, 1fr); gap: 8px; padding: 4px 10px; border-top: 1px solid var(--line2); align-items: start; font-size: 13px; }
.vrow .vn { font-family: var(--code); font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
.vrow .vt { color: var(--muted); font-size: 12px; }
.vrow.changed { animation: flash 1.2s ease-out; }
@keyframes flash { from { background: var(--hi); } to { background: transparent; } }
.val { font-family: var(--code); font-size: 12.5px; word-break: break-word; }
.v-str { color: var(--str); } .v-num { color: var(--num); } .v-bool { color: var(--kw); } .v-none { color: var(--muted); }
.cells { display: flex; flex-wrap: wrap; gap: 0; }
.cell { min-width: 34px; border: 1px solid #C6CEDB; margin: 0 -1px -1px 0; text-align: center; font-family: var(--code); font-size: 12px; background: #fff; }
.cell .ix { display: block; font-size: 10px; color: var(--muted); background: var(--panel2); border-bottom: 1px solid var(--line2); padding: 0 4px; }
.cell .cv { display: block; padding: 2px 5px; }
.cell .mk { display: block; font-size: 10px; color: var(--accent-ink); font-weight: 700; min-height: 14px; background: var(--accent-soft); }
.cell.marked { border-color: var(--accent); }
.bars { display: flex; align-items: flex-end; gap: 3px; height: 90px; padding-top: 14px; margin-bottom: 20px; }
.bar { background: var(--accent); min-width: 14px; border-radius: 3px 3px 0 0; position: relative; }
.bar.marked { background: #E0A800; }
.bar span { position: absolute; bottom: -16px; left: 0; right: 0; text-align: center; font-size: 10px; color: var(--muted); }
.bar em { position: absolute; top: -15px; left: 0; right: 0; text-align: center; font-size: 10px; font-style: normal; color: var(--ink); }
.dtable { border-collapse: collapse; font-size: 12px; }
.dtable td { border: 1px solid var(--line2); padding: 1px 6px; font-family: var(--code); }
.dtable td:first-child { background: var(--panel2); }
.objcard { border: 1px solid #BFD0EA; border-radius: 6px; background: #F6F9FF; display: inline-block; min-width: 180px; }
.objcard .oh { padding: 2px 8px; font-weight: 700; font-size: 12.5px; border-bottom: 1px solid #D9E3F3; color: var(--cls); }
.objcard .orow { display: flex; gap: 8px; padding: 1px 8px; font-size: 12px; }
.objcard .orow b { font-family: var(--code); font-weight: 500; min-width: 60px; }
details.tree > summary { cursor: pointer; font-family: var(--code); font-size: 12px; }
details.tree .kids { padding-left: 16px; border-left: 1px dashed var(--line); margin-left: 4px; }
.watchRow { display: flex; gap: 8px; align-items: center; padding: 3px 0; font-size: 13px; border-bottom: 1px solid var(--line2); }
.watchRow code { min-width: 120px; }
.dbgGrid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(240px, 1fr); gap: 12px; }
.stack .sf { font-family: var(--code); font-size: 12.5px; padding: 2px 0; }
.stack .sf.top { font-weight: 600; }
table.trace { border-collapse: collapse; font-size: 12px; font-family: var(--code); }
table.trace th, table.trace td { border: 1px solid var(--line2); padding: 1px 7px; text-align: left; white-space: nowrap; }
table.trace th { background: var(--panel2); position: sticky; top: 0; font-family: var(--ui); }
table.trace td.chg { background: var(--hi-soft); font-weight: 600; }
table.trace tr.cur td { background: var(--hi); }
svg text { font-family: var(--ui); }

/* tests */
.tres { border: 1px solid var(--line2); border-radius: 7px; margin-bottom: 6px; }
.tres > .th { display: flex; gap: 8px; align-items: center; padding: 5px 10px; font-weight: 700; font-size: 14px; }
.tres.pass > .th::before { content: '✓'; color: var(--ok); } .tres.fail > .th::before { content: '✗'; color: var(--bad); }
.tres.fail { border-color: #F1C4BE; }
.tres .chk { padding: 2px 10px 2px 28px; font-size: 13px; border-top: 1px dashed var(--line2); }
.tres .chk.bad { color: #7A2019; }
.plan { width: 100%; border-collapse: collapse; font-size: 13px; }
.plan th, .plan td { border: 1px solid var(--line2); padding: 3px 5px; text-align: left; }
.plan th { background: var(--panel2); }
.plan input, .plan select { width: 100%; border: 1px solid transparent; padding: 3px 4px; border-radius: 4px; background: transparent; font-size: 13px; }
.plan input:hover, .plan input:focus, .plan select:hover { border-color: var(--line); background: #fff; }
.warnList div { font-size: 13px; padding: 3px 0 3px 22px; position: relative; }
.warnList div::before { position: absolute; left: 4px; }
.warnList .warn::before { content: '!'; color: var(--warn); font-weight: 700; } .warnList .info::before { content: 'i'; color: var(--accent); font-weight: 700; }
.summary { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
.bigcount { font-size: 22px; font-weight: 700; }

/* docs */
.docEntry { border-bottom: 1px solid var(--line2); padding: 8px 0; }
.docEntry h4 { font-family: var(--code); font-size: 14px; margin: 0 0 4px; }
.docEntry dl { display: grid; grid-template-columns: 110px 1fr; gap: 2px 10px; margin: 0; font-size: 13.5px; }
.docEntry dt { color: var(--muted); } .docEntry dd { margin: 0; }
.form { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 6px 10px; align-items: center; max-width: 760px; }
.form input, .form textarea, .form select { border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; background: #fff; width: 100%; }
.form textarea { min-height: 54px; resize: vertical; }
.about { border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px; max-width: 640px; background: #FCFDFE; }
.about h2 { margin: 0 0 4px; font-size: 20px; }

/* history */
.hist { display: grid; grid-template-columns: minmax(260px, 1fr) minmax(0, 1.5fr); gap: 14px; }
.commitItem { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; padding: 5px 6px; border-radius: 6px; cursor: pointer; align-items: center; }
.commitItem:hover { background: var(--panel2); } .commitItem.sel { background: var(--accent-soft); }
.commitItem .msg { font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.commitItem .meta { font-size: 12px; color: var(--muted); }
.sha { font-family: var(--code); font-size: 12px; color: var(--accent-ink); }
.diff { font-family: var(--code); font-size: 12.5px; border: 1px solid var(--line2); border-radius: 6px; overflow: auto; max-height: 320px; }
.diff .dl { white-space: pre; padding: 0 8px; }
.diff .dl.add { background: #E6F4EA; } .diff .dl.del { background: #FBEAE8; } .diff .dl.ctx { color: var(--muted); }
.diff .fh { background: var(--panel2); padding: 2px 8px; font-weight: 600; border-bottom: 1px solid var(--line2); font-family: var(--ui); }
.gitConsole { font-family: var(--code); font-size: 12.5px; background: #F6F8FB; border: 1px solid var(--line2); border-radius: 6px; padding: 6px 8px; max-height: 180px; overflow: auto; white-space: pre-wrap; }
.gitConsole .cmd { color: var(--accent-ink); }
.conflict { border: 1px solid #F0D9AD; border-radius: 7px; margin: 8px 0; overflow: hidden; }
.conflict .side { display: grid; grid-template-columns: 1fr 1fr; }
.conflict pre { margin: 0; padding: 6px 8px; font-family: var(--code); font-size: 12.5px; white-space: pre-wrap; min-height: 30px; }
.conflict .ours { background: #EEF3FF; } .conflict .theirs { background: #F2F9F3; border-left: 1px solid var(--line2); }
.conflict .ch { background: var(--warn-soft); padding: 4px 8px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 13px; }
.field { display: flex; flex-direction: column; gap: 3px; margin-bottom: 6px; font-size: 13px; }
.field input, .field textarea, .field select { border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; background: #fff; }
.field textarea { min-height: 44px; resize: vertical; }

pre.codeView { font-family: var(--code); font-size: 13px; line-height: 1.55; background: #FCFDFE; border: 1px solid var(--line2); border-radius: 7px; padding: 10px 12px; margin: 0; overflow: auto; }
.refSearch { border: 1px solid var(--line); border-radius: 7px; padding: 6px 10px; width: min(420px, 100%); }
.refCat { margin: 12px 0 4px; font-size: 13px; color: var(--muted); font-weight: 700; }
.refItem { display: grid; grid-template-columns: minmax(200px, 330px) 1fr; gap: 12px; padding: 4px 0; border-bottom: 1px solid var(--line2); font-size: 13.5px; }
.refItem code { color: var(--bi); }
.fileRow { display: flex; gap: 10px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--line2); font-size: 14px; }
.fileRow code { min-width: 160px; }
textarea.fileEdit { width: 100%; min-height: 180px; font-family: var(--code); font-size: 13px; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }

/* menus, modal, toast */
.menu { position: fixed; z-index: 50; background: #fff; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 10px 28px rgba(27, 36, 48, .16); padding: 5px; min-width: 240px; max-height: 70vh; overflow: auto; }
.menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 5px; cursor: pointer; font-size: 14px; }
.menu button:hover, .menu button:focus { background: var(--accent-soft); }
.menu .mh { font-size: 12px; color: var(--muted); padding: 6px 10px 2px; }
.menu hr { border: 0; border-top: 1px solid var(--line2); margin: 4px 0; }
.modalBack { position: fixed; inset: 0; background: rgba(27, 36, 48, .35); z-index: 60; display: grid; place-items: center; padding: 16px; }
.modal { background: #fff; border-radius: 10px; max-width: min(820px, 100%); width: 100%; max-height: 86vh; overflow: auto; padding: 16px 18px; box-shadow: 0 20px 50px rgba(0, 0, 0, .2); }
.modal h3 { margin: 0 0 10px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 8px 14px; border-radius: 8px; z-index: 70; font-size: 14px; max-width: 90vw; }

@media (max-width: 900px) {
  #app { display: block; height: auto; }
  .work { grid-template-columns: 1fr; }
  .editorPane { height: 60vh; }
  .stagePane { min-height: 60vh; }
  .dock, .dock.tall { height: 70vh; }
  .cols, .hist, .dbgGrid { grid-template-columns: 1fr; }
  .runbar { margin-left: 0; width: 100%; }
  .status { text-align: left; }

}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }


@media (max-width: 600px) { .brand .logo, .brand .wordmark { display: none; } .brand .icon { display: block; } .credits { flex-direction: column; } }
.aboutBox a { color: var(--brand-ink); }
.aboutBox .feedback { border-left: 3px solid var(--brand); padding: 4px 0 4px 10px; font-weight: 700; }

    let hint = '';
    if (t.t === 'op' && t.v === '=' ) hint = this.ed === 'es' ? ' Para comparar usa `==`.' : ' To compare, use `==`.';
    throw this.err('E105', { tok: this.tokText(t), hint });
  }

  parseProgram() {
    const body = this.statements(new Set());
    return { body, funcs: this.funcs, classes: this.classes, tests: this.tests, src: this.src, ed: this.ed };
  }

  // parse statements until a terminator keyword (not consumed)
  statements(terms) {
    const out = [];
    for (;;) {
      this.skipNl();
      const t = this.peek();
      if (t.t === 'eof') {
        if (this.blocks.length) {
          const b = this.blocks[this.blocks.length - 1];
          throw new LangError('E101', { kw: this.K(b.kw), open: b.line, end: this.K('end') + ' ' + this.K(CLOSER_OF[b.kw]) }, b.line);
        }
        return out;
      }
      if (t.t === 'kw' && terms.has(t.v)) return out;
      if (t.t === 'kw' && t.v === 'end') {
        if (!this.blocks.length) {
          const nx = this.peek(1);
          const said = this.tokText(t) + (nx.t === 'kw' ? ' ' + this.tokText(nx) : '');
          throw this.err('E109', { said, line: t.line, kw: nx.t === 'kw' ? this.tokText(nx) : '' }, t);
        }
        return out;
      }
      if (t.t === 'kw' && (t.v === 'else' || t.v === 'else_if' || t.v === 'on_error')) {
        throw this.err('E105', { tok: this.tokText(t), hint: '' });
      }
      out.push(this.statement());
    }
  }

  // consume END <kw> for the innermost block
  closeBlock() {
    const b = this.blocks[this.blocks.length - 1];
    const endTok = this.peek();
    if (!(endTok.t === 'kw' && endTok.v === 'end')) {
      throw new LangError('E101', { kw: this.K(b.kw), open: b.line, end: this.K('end') + ' ' + this.K(CLOSER_OF[b.kw]) }, b.line);
    }
    this.next();
    const kt = this.peek();
    const want = CLOSER_OF[b.kw];
    if (!(kt.t === 'kw' && (BLOCK_KW.includes(kt.v) || kt.v === 'for_each'))) {
      throw this.err('E108', { end: this.tokText(endTok), example: this.K('end') + ' ' + this.K(want) }, endTok);
    }
    const said = CLOSER_OF[kt.v] || kt.v;
    if (said !== want) {
      // does it match an outer block? then the inner one is unclosed
      const outer = this.blocks.slice(0, -1).some(x => CLOSER_OF[x.kw] === said);
      if (outer) throw new LangError('E101', { kw: this.K(b.kw), open: b.line, end: this.K('end') + ' ' + this.K(want) }, b.line);
      throw this.err('E102', { line: endTok.line, said: this.tokText(endTok) + ' ' + this.tokText(kt), kw: this.K(b.kw),
        open: b.line, end: this.K('end') + ' ' + this.K(want) }, endTok);
    }
    this.next();
    this.blocks.pop();
    const endLine = endTok.line;
    this.endStmt();
    return endLine;
  }

  body(kw, line) {
    this.blocks.push({ kw, line });
    const st = this.statements(new Set());
    return st;
  }

  statement() {
    const t = this.peek();
    const line = t.line;
    if (t.t === 'doc') {
      this.next();
      const doc = this.parseDoc(t);
      this.skipNl();
      const nx = this.peek();
      if (!(nx.t === 'kw' && (nx.v === 'function' || nx.v === 'class'))) throw this.err('E122', { doc: 'DOC', function: this.K('function'), class: this.K('class') }, t);
      const node = this.statement();
      node.doc = doc;
      return node;
    }
    if (t.t === 'kw') {
      switch (t.v) {
        case 'print': {
          this.next();
          const exprs = [];
          if (!(this.peek().t === 'nl' || this.peek().t === 'eof')) {
            exprs.push(this.expr());
            while (this.isOp(',')) { this.next(); exprs.push(this.expr()); }
          }
          this.endStmt();
          return { k: 'Print', exprs, line };
        }
        case 'if': return this.parseIf();
        case 'while': {
          this.next();
          const cond = this.expr();
          if (this.isOp('=')) throw this.err('E107', {});
          this.endStmt();
          this.loopDepth++;
          const body = this.body('while', line);
          this.loopDepth--;
          const endLine = this.closeBlock();
          return { k: 'While', cond, body, line, endLine };
        }
        case 'repeat': {
          this.next();
          const count = this.expr();
          this.expectKw('times');
          this.endStmt();
          this.loopDepth++;
          const body = this.body('repeat', line);
          this.loopDepth--;
          const endLine = this.closeBlock();
          return { k: 'Repeat', count, body, line, endLine };
        }
        case 'for': {
          this.next();
          const v = this.name();
          this.expectKw('from');
          const from = this.expr();
          this.expectKw('to');
          const to = this.expr();
          let step = null;
          if (this.isKw('step')) { this.next(); step = this.expr(); }
          this.endStmt();
          this.loopDepth++;
          const body = this.body('for', line);
          this.loopDepth--;
          const endLine = this.closeBlock();
          return { k: 'For', v, from, to, step, body, line, endLine };
        }
        case 'for_each': {
          this.next();
          const v = this.name();
          this.expectKw('in');
          const iter = this.expr();
          this.endStmt();
          this.loopDepth++;
          const body = this.body('for_each', line);
          this.loopDepth--;
          const endLine = this.closeBlock();
          return { k: 'ForEach', v, iter, body, line, endLine };
        }
        case 'break': case 'continue': {
          this.next();
          if (!this.loopDepth) throw this.err('E118', { kw: this.tokText(t) }, t);
          this.endStmt();
          return { k: t.v === 'break' ? 'Break' : 'Continue', line };
        }
        case 'function': {
          if (this.blocks.length && !(this.classDepth && this.blocks.length === 1)) throw this.err('E112', {}, t);
          return this.parseFunc();
        }
        case 'class': {
          if (this.blocks.length) throw this.err('E112', {}, t);
          return this.parseClass();
        }
        case 'return': {
          this.next();
          if (!this.funcDepth) throw this.err('E117', { ret: this.tokText(t) }, t);
          let value = null;
          if (!(this.peek().t === 'nl' || this.peek().t === 'eof')) value = this.expr();
          this.endStmt();
          return { k: 'Return', value, line };
        }
        case 'try': {
          this.next(); this.endStmt();
          this.blocks.push({ kw: 'try', line });
          const body = this.statements(new Set(['on_error']));
          let errVar = null, handler = [];
          if (this.isKw('on_error')) {
            this.next();
            if (this.peek().t === 'id') errVar = this.name();
            this.endStmt();
            handler = this.statements(new Set());
          }
          const endLine = this.closeBlock();
          return { k: 'Try', body, errVar, handler, line, endLine };
        }
        case 'fail': {
          this.next();
          const msg = this.expr();
          this.endStmt();
          return { k: 'Fail', msg, line };
        }
        case 'test': {
          if (this.blocks.length) throw this.err('E112', {}, t);
          this.next();
          const nt = this.peek();
          let name;
          if (nt.t === 'str') { this.next(); name = nt.v; } else throw this.err('E120', { want: '"..."' });
          let inputs = null;
          if (this.isKw('with_inputs')) { this.next(); inputs = this.expr(); }
          this.endStmt();
          this.inTest++;
          const body = this.body('test', line);
          this.inTest--;
          const endLine = this.closeBlock();
          const node = { k: 'Test', name, inputs, body, line, endLine };
          this.tests.push(node);
          return node;
        }
        case 'expect': case 'expect_error': {
          this.next();
          if (!this.inTest) throw this.err('E116', { kw: this.tokText(t), test: this.K('test') }, t);
          const st = this.peek().s;
          const e = this.expr();
          e.src = this.src.slice(st, this.prevEnd);
          if (t.v === 'expect') { this.endStmt(); return { k: 'Expect', e, line }; }
          let contains = null;
          if (this.isKw('contains')) { this.next(); contains = this.expr(); }
          this.endStmt();
          return { k: 'ExpectError', e, contains, line };
        }
        case 'else': case 'else_if': case 'then': case 'on_error': case 'times': case 'from': case 'to': case 'step':
        case 'extends': case 'contains': case 'with_inputs':
          throw this.err('E105', { tok: this.tokText(t), hint: '' }, t);
        case 'init':
          throw this.err('E119', { class: this.K('class'), init: this.K('init'), function: this.K('function'), doc: 'DOC' }, t);
      }
    }
    // assignment or expression statement
    const st = t.s;
    const e = this.expr();
    const op = this.peek();
    if (op.t === 'op' && ['=', '+=', '-=', '*=', '/='].includes(op.v)) {
      if (!['Name', 'Index', 'Attr'].includes(e.k)) throw this.err('E114', {}, op);
      this.next();
      const value = this.expr();
      this.endStmt();
      return { k: 'Assign', target: e, op: op.v, value, line };
    }
    this.endStmt();
    e.src = e.src || this.src.slice(st, this.prevEnd);
    return { k: 'ExprStmt', e, line };
  }

  parseIf() {
    const t = this.next();
    const line = t.line;
    const branches = [];
    let cond = this.expr();
    if (this.isOp('=')) throw this.err('E107', {});
    if (!this.isKw('then')) {
      const nx = this.peek();
      if (nx.t === 'nl' || nx.t === 'eof') throw this.err('E106', { if: this.K('if'), then: this.K('then') });
      throw this.err('E105', { tok: this.tokText(nx), hint: '' });
    }
    this.next(); this.endStmt();
    this.blocks.push({ kw: 'if', line });
    let body = this.statements(new Set(['else', 'else_if']));
    branches.push({ cond, body, line });
    let elseBody = null, elseLine = null;
    for (;;) {
      if (this.isKw('else_if')) {
        const bl = this.next().line;
        const c = this.expr();
        if (this.isOp('=')) throw this.err('E107', {});
        if (!this.isKw('then')) throw this.err('E106', { if: this.K('else_if'), then: this.K('then') });
        this.next(); this.endStmt();
        const b = this.statements(new Set(['else', 'else_if']));
        branches.push({ cond: c, body: b, line: bl });
        continue;
      }
      if (this.isKw('else')) {
        elseLine = this.next().line; this.endStmt();
        elseBody = this.statements(new Set());
      }
      break;
    }
    const endLine = this.closeBlock();
    return { k: 'If', branches, elseBody, elseLine, line, endLine };
  }

  params() {
    this.expectOp('(');
    const ps = [];
    let sawDefault = false;
    if (!this.isOp(')')) {
      for (;;) {
        const name = this.name();
        let def = null;
        if (this.isOp('=')) { this.next(); def = this.expr(); sawDefault = true; }
        else if (sawDefault) throw this.err('E105', { tok: name, hint: this.ed === 'es' ? ' Los parámetros con valor por defecto van al final.' : ' Parameters with default values must come last.' });
        ps.push({ name, def });
        if (this.isOp(',')) { this.next(); continue; }
        break;
      }
    }
    this.expectOp(')');
    return ps;
  }

  parseFunc(isMethod) {
    const t = this.next();
    const line = t.line;
    const name = this.name();
    const params = this.params();
    this.endStmt();
    this.funcDepth++;
    if (isMethod) this.inMethod++;
    const body = this.body('function', line);
    this.funcDepth--;
    if (isMethod) this.inMethod--;
    const endLine = this.closeBlock();
    const node = { k: 'FuncDef', name, params, body, line, endLine };
    if (!isMethod) this.funcs.set(name, node);
    return node;
  }

  parseClass() {
    const t = this.next();
    const line = t.line;
    const name = this.name();
    let parent = null;
    if (this.isKw('extends')) { this.next(); parent = this.name(); }
    this.endStmt();
    this.blocks.push({ kw: 'class', line });
    this.classDepth++;
    let init = null; const methods = []; let pendingDoc = null;
    for (;;) {
      this.skipNl();
      const m = this.peek();
      if (m.t === 'kw' && m.v === 'end') break;
      if (m.t === 'eof') throw new LangError('E101', { kw: this.K('class'), open: line, end: this.K('end') + ' ' + this.K('class') }, line);
      if (m.t === 'doc') { this.next(); pendingDoc = this.parseDoc(m); continue; }
      if (m.t === 'kw' && m.v === 'init') {
        this.next();
        const params = this.params();
        this.endStmt();
        this.funcDepth++; this.inMethod++;
        const body = this.body('init', m.line);
        this.funcDepth--; this.inMethod--;
        const endLine = this.closeBlock();
        init = { k: 'FuncDef', name: 'INIT', params, body, line: m.line, endLine, isInit: true, doc: pendingDoc };
        pendingDoc = null;
        continue;
      }
      if (m.t === 'kw' && m.v === 'function') {
        const f = this.parseFunc(true);
        f.doc = pendingDoc; pendingDoc = null;
        methods.push(f);
        continue;
      }
      throw this.err('E119', { class: this.K('class'), init: this.K('init'), function: this.K('function'), doc: 'DOC' }, m);
    }
    this.classDepth--;
    const endLine = this.closeBlock();
    const node = { k: 'ClassDef', name, parent, init, methods, line, endLine };
    this.classes.set(name, node);
    return node;
  }

  parseDoc(t) {
    const fields = {}; const examples = []; let last = null;
    const labels = {};
    for (const f in DOC_FIELDS) { labels[norm(DOC_FIELDS[f][0])] = f; labels[norm(DOC_FIELDS[f][1])] = f; }
    for (const ln of t.lines) {
      const m = ln.text.match(/^\s*([\p{L}]+)\s*:\s*(.*)$/u);
      if (m && labels[norm(m[1])]) {
        const f = labels[norm(m[1])];
        if (f === 'example') { examples.push({ text: m[2].trim(), line: ln.line }); last = null; }
        else { fields[f] = (fields[f] ? fields[f] + ' ' : '') + m[2].trim(); last = f; }
      } else if (ln.text.trim()) {
        if (last) fields[last] += ' ' + ln.text.trim();
        else { fields._free = (fields._free ? fields._free + ' ' : '') + ln.text.trim(); }
      }
    }
    return { fields, examples, line: t.line, endLine: t.endLine };
  }

  // ----- expressions -----
  expr() {
    const st = this.peek().s;
    const e = this.orExpr();
    if (!e.src) e.src = this.src.slice(st, this.prevEnd);
    return e;
  }
  mk(node, st) { node.src = this.src.slice(st, this.prevEnd); return node; }
  orExpr() {
    const st = this.peek().s;
    let l = this.andExpr();
    while (this.isKw('or')) { const line = this.next().line; const r = this.andExpr(); l = this.mk({ k: 'Logic', op: 'or', l, r, line }, st); }
    return l;
  }
  andExpr() {
    const st = this.peek().s;
    let l = this.notExpr();
    while (this.isKw('and')) { const line = this.next().line; const r = this.notExpr(); l = this.mk({ k: 'Logic', op: 'and', l, r, line }, st); }
    return l;
  }
  notExpr() {
    const st = this.peek().s;
    if (this.isKw('not')) { const line = this.next().line; const e = this.notExpr(); return this.mk({ k: 'Not', e, line }, st); }
    return this.cmpExpr();
  }
  cmpExpr() {
    const st = this.peek().s;
    const l = this.addExpr();
    const t = this.peek();
    let op = null;
    if (t.t === 'op' && ['==', '!=', '<', '>', '<=', '>='].includes(t.v)) op = t.v;
    else if (t.t === 'kw' && t.v === 'in') op = 'in';
    else if (t.t === 'kw' && t.v === 'not' && this.peek(1).t === 'kw' && this.peek(1).v === 'in') { this.next(); op = 'notin'; }
    if (!op) return l;
    this.next();
    const r = this.addExpr();
    const t2 = this.peek();
    if (t2.t === 'op' && ['==', '!=', '<', '>', '<=', '>='].includes(t2.v)) {
      throw this.err('E105', { tok: t2.v, hint: this.ed === 'es' ? ' Usa `Y` para unir dos comparaciones.' : ' Use `AND` to join two comparisons.' });
    }
    return this.mk({ k: 'Cmp', op, l, r, line: t.line }, st);
  }
  addExpr() {
    const st = this.peek().s;
    let l = this.mulExpr();
    for (;;) {
      const t = this.peek();
      if (t.t === 'op' && (t.v === '+' || t.v === '-')) { this.next(); const r = this.mulExpr(); l = this.mk({ k: 'Bin', op: t.v, l, r, line: t.line }, st); }
      else return l;
    }
  }
  mulExpr() {
    const st = this.peek().s;
    let l = this.unary();
    for (;;) {
      const t = this.peek();
      let op = null;
      if (t.t === 'op' && (t.v === '*' || t.v === '/')) op = t.v;
      else if (t.t === 'kw' && (t.v === 'div' || t.v === 'mod')) op = t.v;
      if (!op) return l;
      this.next();
      const r = this.unary();
      l = this.mk({ k: 'Bin', op, l, r, line: t.line }, st);
    }
  }
  unary() {
    const st = this.peek().s;
    if (this.isOp('-')) { const line = this.next().line; const e = this.unary(); return this.mk({ k: 'Neg', e, line }, st); }
    if (this.isOp('+')) { this.next(); return this.unary(); }
    return this.power();
  }
  power() {
    const st = this.peek().s;
    const b = this.postfix();
    if (this.isOp('^')) { const line = this.next().line; const ex = this.unary(); return this.mk({ k: 'Bin', op: '^', l: b, r: ex, line }, st); }
    return b;
  }
  args() {
    const out = [];
    if (this.isOp(')')) { this.next(); return out; }
    for (;;) {
      out.push(this.expr());
      if (this.isOp('=')) throw this.err('E105', { tok: '=', hint: this.ed === 'es' ? ' Escribe solo los valores, en orden.' : ' Write only the values, in order.' });
      if (this.isOp(',')) { this.next(); continue; }
      break;
    }
    this.expectOp(')');
    return out;
  }
  postfix() {
    const st = this.peek().s;
    let e = this.primary();
    for (;;) {
      const t = this.peek();
      if (t.t === 'op' && t.v === '(') { this.next(); const args = this.args(); e = this.mk({ k: 'Call', f: e, args, line: t.line }, st); continue; }
      if (t.t === 'op' && t.v === '[') {
        this.next();
        let a = null, b = null, slice = false;
        if (!this.isOp(':')) a = this.expr();
        if (this.isOp(':')) { slice = true; this.next(); if (!this.isOp(']')) b = this.expr(); }
        this.expectOp(']');
        e = slice ? this.mk({ k: 'Slice', o: e, a, b, line: t.line }, st) : this.mk({ k: 'Index', o: e, i: a, line: t.line }, st);
        continue;
      }
      if (t.t === 'op' && t.v === '.') {
        this.next();
        const nt = this.peek();
        let name;
        if (nt.t === 'id') { this.next(); name = nt.v; }
        else if (nt.t === 'kw') { this.next(); name = this.tokText(nt); }
        else throw this.err('E111', {});
        if (e.k === 'Parent') {
          const isInit = norm(name) === norm(this.K('init')) || norm(name) === 'INIT' || norm(name) === 'INICIAR';
          e = this.mk({ k: 'ParentRef', name: isInit ? null : name, line: t.line }, st);
          continue;
        }
        e = this.mk({ k: 'Attr', o: e, name, line: t.line }, st);
        continue;
      }
      return e;
    }
  }
  primary() {
    const t = this.peek();
    const st = t.s;
    if (t.t === 'num') { this.next(); return this.mk({ k: 'Num', v: t.v, dec: t.dec, line: t.line }, st); }
    if (t.t === 'str') { this.next(); return this.mk({ k: 'Str', v: t.v, line: t.line }, st); }
    if (t.t === 'id') { this.next(); return this.mk({ k: 'Name', name: t.v, line: t.line }, st); }
    if (t.t === 'kw') {
      switch (t.v) {
        case 'true': this.next(); return this.mk({ k: 'Bool', v: true, line: t.line }, st);
        case 'false': this.next(); return this.mk({ k: 'Bool', v: false, line: t.line }, st);
        case 'nothing': this.next(); return this.mk({ k: 'Nothing', line: t.line }, st);
        case 'self':
          this.next();
          if (!this.inMethod) throw this.err('E121', { self: this.tokText(t) }, t);
          return this.mk({ k: 'Self', line: t.line }, st);
        case 'parent':
          this.next();
          if (!this.inMethod) throw this.err('E121', { self: this.tokText(t) }, t);
          if (!this.isOp('.')) throw this.err('E120', { want: '.' });
          return { k: 'Parent', line: t.line };
        case 'new': {
          this.next();
          const cname = this.name();
          let args = [];
          if (this.isOp('(')) { this.next(); args = this.args(); }
          return this.mk({ k: 'New', cls: cname, args, line: t.line }, st);
        }
      }
      throw this.err('E115', { word: this.tokText(t) }, t);
    }
    if (t.t === 'op' && t.v === '(') {
      this.next();
      const e = this.expr();
      this.expectOp(')');
      return this.mk({ k: 'Paren', e, line: t.line }, st);
    }
    if (t.t === 'op' && t.v === '[') {
      this.next();
      const items = [];
      if (this.isOp(']')) { this.next(); return this.mk({ k: 'List', items, line: t.line }, st); }
      const first = this.expr();
      if (this.isKw('for') || this.isKw('for_each')) {
        this.next();
        const v = this.name();
        this.expectKw('in');
        const iter = this.expr();
        let cond = null;
        if (this.isKw('if')) { this.next(); cond = this.expr(); }
        this.expectOp(']');
        return this.mk({ k: 'Comp', e: first, v, iter, cond, line: t.line }, st);
      }
      items.push(first);
      while (this.isOp(',')) { this.next(); if (this.isOp(']')) break; items.push(this.expr()); }
      this.expectOp(']');
      return this.mk({ k: 'List', items, line: t.line }, st);
    }
    if (t.t === 'op' && t.v === '{') {
      this.next();
      const pairs = [];
      while (!this.isOp('}')) {
        const key = this.expr();
        this.expectOp(':');
        const val = this.expr();
        pairs.push([key, val]);
        if (this.isOp(',')) { this.next(); continue; }
        break;
      }

  arityText(min, max) {

  // ----- calls -----
  *call(fn, args, node, f) {

  *invoke(def, args, selfObj, cls, node) {

  *construct(cls, args, node) {

  *callMethod(o, name, args, node, f) {

    if (!m) {
      const grp = isList(o) ? REG.list : isText(o) ? REG.text : isDict(o) ? REG.dict : [];
      const c = closest(name, grp.map(x => localMember(x.n, this.ed)));
      throw this.err('E207', { what: '`' + node.f.o.src + '` (' + aTypeName(o, this.ed) + ')', attr: name, hint: c ? this.L(` Did you mean \`${c}\`?`, ` ¿Querías decir \`${c}\`?`) : '' }, line);

    if (args.length < (m.min || 0) || args.length > max) throw this.err('E208', { name: localMember(m.n, this.ed), want: this.arityText(m.min || 0, max), got: args.length }, line);
    const ctx = { r: this, f, node, line, src: node.f.o.src, fnName: m.n, isMethod: true };

  }
  *display(v) {
    if (v instanceof Obj) {

      if (fm && !(fm.m instanceof NativeMethod)) {

        return show(r, this.ed);

    return show(v, this.ed);
  }

  // ----- expressions -----
  isPure(e) {
    if (e.pure !== undefined) return e.pure;
    let p;
    switch (e.k) {
      case 'Call': case 'New': case 'Comp': p = false; break;
      case 'Num': case 'Str': case 'Bool': case 'Nothing': case 'Name': case 'Self': p = true; break;
      case 'List': p = e.items.every(x => this.isPure(x)); break;
      case 'Dict': p = e.pairs.every(([a, b]) => this.isPure(a) && this.isPure(b)); break;
      case 'Index': p = this.isPure(e.o) && this.isPure(e.i); break;
      case 'Slice': p = this.isPure(e.o) && (!e.a || this.isPure(e.a)) && (!e.b || this.isPure(e.b)); break;
      case 'Attr': p = this.isPure(e.o); break;
      case 'Bin': case 'Cmp': case 'Logic': p = this.isPure(e.l) && this.isPure(e.r); break;

  selfOf(f, line) {

  // synchronous evaluation for call-free expressions

      case 'Bool': return e.v;
      case 'Nothing': return null;

      case 'Self': return this.selfOf(f, e.line);
      case 'Paren': return this.evs(e.e, f);
      case 'List': return e.items.map(x => this.evs(x, f));
      case 'Dict': { const m = new Map(); for (const [k, v] of e.pairs) m.set(this.dictKey(this.evs(k, f), e.line), this.evs(v, f)); return m; }
      case 'Index': return this.getIndex(this.evs(e.o, f), this.evs(e.i, f), e);
      case 'Slice': return this.slice(this.evs(e.o, f), e.a ? this.evs(e.a, f) : null, e.b ? this.evs(e.b, f) : null, e);
      case 'Attr': return this.getAttr(this.evs(e.o, f), e.name, e);
      case 'Bin': return this.binop(e.op, this.evs(e.l, f), this.evs(e.r, f), e);
      case 'Cmp': return this.compare(e.op, this.evs(e.l, f), this.evs(e.r, f), e);
      case 'Logic': {
        const a = this.checkBool(this.evs(e.l, f), e.op, e.line);
        if (e.op === 'and' ? !a : a) return a;
        return this.checkBool(this.evs(e.r, f), e.op, e.line);
      }
      case 'Not': return !this.checkBool(this.evs(e.e, f), 'not', e.line);
      case 'Neg': { const v = this.evs(e.e, f); if (!isNum(v)) { if (v === null) throw this.nothingErr(e, e.e); throw this.err('E203', { op: '-', a: aTypeName(v, this.ed), b: aTypeName(v, this.ed) }, e.line); } return mkNum(-nv(v), isWhole(v)); }

  }
  *ev(e, f) {
    if (this.isPure(e)) return this.evs(e, f);
    switch (e.k) {
      case 'Paren': return yield* this.ev(e.e, f);
      case 'List': { const r = []; for (const x of e.items) r.push(yield* this.ev(x, f)); return r; }
      case 'Dict': { const m = new Map(); for (const [k, v] of e.pairs) { const kk = this.dictKey(yield* this.ev(k, f), e.line); m.set(kk, yield* this.ev(v, f)); } return m; }

      case 'Slice': { const o = yield* this.ev(e.o, f); const a = e.a ? yield* this.ev(e.a, f) : null; const b = e.b ? yield* this.ev(e.b, f) : null; return this.slice(o, a, b, e); }
      case 'Attr': { const o = yield* this.ev(e.o, f); return this.getAttr(o, e.name, e); }
      case 'Bin': { const a = yield* this.ev(e.l, f); const b = yield* this.ev(e.r, f); return this.binop(e.op, a, b, e); }

      case 'Logic': {
        const a = this.checkBool(yield* this.ev(e.l, f), e.op, e.line);

        return this.checkBool(yield* this.ev(e.r, f), e.op, e.line);
      }
      case 'Not': return !this.checkBool(yield* this.ev(e.e, f), 'not', e.line);
      case 'Neg': { const v = yield* this.ev(e.e, f); if (!isNum(v)) throw this.err('E203', { op: '-', a: aTypeName(v, this.ed), b: aTypeName(v, this.ed) }, e.line); return mkNum(-nv(v), isWhole(v)); }
      case 'Call': {

  // ----- statements -----
  *block(list, f) { for (let i = 0; i < list.length; i++) yield* this.exec(list[i], f); }
  *exec(s, f) {
    if (s.k === 'FuncDef' || s.k === 'ClassDef' || s.k === 'Test') return;
    this.curLine = s.line; f.line = s.line;
    yield s;

          const c = this.checkBool(yield* this.ev(br.cond, f), 'if', br.line);

      case 'While': {

          if (v === null) throw this.nothingErr(s, nm);

        }
        const x0 = nv(a), x1 = nv(b), dx = nv(st);
        if (dx === 0) throw this.err('E219', { fn: this.K('for'), msg: this.L('STEP can\'t be 0.', 'CON PASO no puede ser 0.') }, s.line);

        }

      }

        }

      }

        }

      }
      case 'Fail': {
        const v = yield* this.ev(s.msg, f);

      }
      case 'Expect': {
        const log = this.testLog;
        const e = s.e;
        let ok, detail = null;
        if (e.k === 'Cmp' && (e.op === '==' || e.op === '!=')) {
          const a = yield* this.ev(e.l, f), b = yield* this.ev(e.r, f);

            this.L(`\`${e.l.src}\` gave \`${show(a, this.ed, true)}\` but the test expected \`${show(b, this.ed, true)}\``, `\`${e.l.src}\` dio \`${show(a, this.ed, true)}\` pero la prueba esperaba \`${show(b, this.ed, true)}\``) :
            this.L(`\`${e.l.src}\` gave \`${show(a, this.ed, true)}\`, which the test said it should not`, `\`${e.l.src}\` dio \`${show(a, this.ed, true)}\`, que la prueba decía que no debía dar`);

          const got = errText(failed, this.ed);
          ok = got.includes(want);
          if (!ok) detail = this.L(`\`${s.e.src}\` failed with "${got}", which does not contain "${want}"`, `\`${s.e.src}\` falló con "${got}", que no contiene "${want}"`);
        } else ok = true;
        if (log) log.push({ ok, line: s.line, src: s.e.src, detail });
        return;
      }
    }
  }

  // ----- driving -----
  *mainGen() { yield* this.block(this.prog.body, this.gframe); }

        FOR j FROM 0 TO n - 2 - i

                items[j] = items[j + 1]

def caesar(text, shift):

  const items = [
    { label: '＋ ' + T('newProject'), onclick: () => createProject(T('untitled'), '', ED) },
    { label: T('openProject') + '…', onclick: openProjectDialog },
    { label: T('dupProject'), onclick: () => { const c = JSON.parse(JSON.stringify(P)); c.id = uid(); c.name = P.name + ' (2)'; Store.data.projects[c.id] = c; Store.save(); openProject(c.id); } },
    'hr',
    { label: T('exportProject'), onclick: () => { saveProject(); offerDownload((P.name || 'project').replace(/[^\w-]+/g, '_') + '.json', JSON.stringify(P, null, 1)); } },
    { label: T('importProject'), onclick: () => $('#importFile').click() },
    'hr',
    { label: T('delProject'), onclick: () => { if (!confirm(T('confirmDel'))) return; delete Store.data.projects[P.id]; Store.save(); const ids = Object.keys(Store.data.projects); if (ids.length) openProject(ids[0]); else loadExample(BL.SAMPLES.examples[0]); } },
    'hr',
    { label: T('aboutMenu'), onclick: showAbout }
  ];
  showMenu($('#btnProject'), items);
}
function openProjectDialog() {
  const list = Object.values(Store.data.projects).sort((a, b) => b.updated - a.updated);
  showModal(h('div', null, h('h3', null, T('openProject')), ...list.map(p => h('div', { class: 'fileRow' }, h('button', { class: 'linkbtn', onclick: () => { closeModal(); openProject(p.id); } }, p.name), h('span', { class: 'chip' }, p.edition.toUpperCase()), h('span', { class: 'muted small' }, new Date(p.updated).toLocaleString()))),
    h('div', { class: 'toolbar', style: 'margin-top:10px' }, h('button', { class: 'btn', onclick: closeModal }, T('close')))));
}
function showAbout() {
  const logo = $('#btnBrand img.logo');
  showModal(h('div', { class: 'aboutBox' },
    h('img', { class: 'aboutLogo', src: logo ? logo.src : '', alt: 'BASIC62', width: 254, height: 48 }),
    h('h2', null, 'BASIC62 CodeLab'),
    h('p', { class: 'lead' }, T('abIntro')),
    h('p', { class: 'tag' }, T('abLang') + '. ' + T('abTag')),
    h('dl', null,
      h('dt', null, T('abConcept')), h('dd', null, 'Andreas Tsouchlaris'),
      h('dt', null, T('ftSupported')), h('dd', null, h('a', { href: 'https://binarylogic.net', target: '_blank', rel: 'noopener' }, 'Binary Logic')),
      h('dt', null, T('abAI')), h('dd', null, 'Claude (Anthropic)')),
    h('p', null, T('abBinary')),
    h('p', null, T('abInspired')),
    h('p', { class: 'feedback' }, T('abFeedback')),
    h('p', { class: 'fine' }, T('abIndependent')),
    h('p', { class: 'fine' }, '© 2026 Andreas Tsouchlaris'),
    h('p', { class: 'fine' }, h('b', null, T('abLicenseLabel') + ': '), T('abLicense')),
    h('p', { class: 'fine' }, h('b', null, T('abStatusLabel') + ': '), T('abVersion')),
    h('div', { class: 'toolbar', style: 'margin-top:12px' }, h('button', { class: 'btn', onclick: closeModal }, T('close')))));
}
function examplesMenu() {
  showMenu($('#btnExamples'), BL.SAMPLES.examples.map(ex => ({ label: ED === 'es' ? ex.titleEs : ex.title, onclick: () => loadExample(ex) })));
}
function setEdition(ed) {
  if (ed === ED) return;
  stopRun(true);
  const from = ED;
  const res = BL.convertEdition(editor.value, from, ed);
  ED = ed; P.edition = ed;
  applyI18n();
  setCode(res.code);
  editor.setMarks({ err: 0, cur: 0 });
  S.prog = null; S.testRun = null; S.runner = null; resetStage(); setStatus('', T('ready'));
  selectTab(currentTab);
  toast(T('converted', { e: ed === 'es' ? 'Español' : 'English' }) + (res.renamed.length ? ' ' + T('renamedIds', { x: res.renamed.join(', ') }) : ''));
}
// ----- init -----
function init() {
  buildNameSets();
  initCanvas();
  Con.el = $('#console');
  editor = new Editor($('#editor'));
  editor.onChange = onCodeChange;
  editor.onCaret = contextHelp;
  editor.onGutter = (line, e) => {
    if (P.breakpoints[line] !== undefined) delete P.breakpoints[line]; else P.breakpoints[line] = {};
    applyBreakpoints();
    if (currentTab === 'debug') refreshDebug();
  };
  $('#btnRun').addEventListener('click', run);
  $('#btnStop').addEventListener('click', () => stopRun());
  $('#btnStepTop').addEventListener('click', () => stepCmd('over'));
  $('#btnTests').addEventListener('click', runTestsUI);
  $('#btnClearOut').addEventListener('click', () => Con.clear());
  $('#btnCanvas').addEventListener('click', () => showCanvas($('#canvasWrap').classList.contains('off')));
  $('#btnExamples').addEventListener('click', examplesMenu);
  $('#btnProject').addEventListener('click', projectMenu);
  $('#btnBrand').addEventListener('click', showAbout);
  $('#btnAboutFoot').addEventListener('click', showAbout);
  $('#btnDock').addEventListener('click', () => { const d = $('#dock'); if (d.classList.contains('tall')) { d.classList.remove('tall'); d.classList.add('short'); } else if (d.classList.contains('short')) d.classList.remove('short'); else d.classList.add('tall'); });
  for (const b of $$('.edition .seg')) b.addEventListener('click', () => setEdition(b.dataset.ed));
  for (const b of $$('.tabs [role=tab]')) b.addEventListener('click', () => selectTab(b.dataset.tab));
  $('#projName').addEventListener('input', (e) => { P.name = e.target.value; saveSoon(); });
  $('#modal').addEventListener('mousedown', (e) => { if (e.target.id === 'modal') closeModal(); });
  const imp = h('input', { type: 'file', id: 'importFile', accept: '.json', hidden: true });
  imp.addEventListener('change', () => {
    const f = imp.files[0]; if (!f) return;
    const rd = new FileReader(); rd.onload = () => { try { const p = JSON.parse(String(rd.result)); if (!p.files || typeof p.files['main.bl'] !== 'string') throw new Error('bad'); p.id = uid(); Store.data.projects[p.id] = p; Store.save(); openProject(p.id); } catch (e) { toast(ED === 'es' ? 'Ese archivo no es un proyecto válido.' : 'That file is not a valid project.'); } imp.value = ''; }; rd.readAsText(f);
  });
  document.body.append(imp);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { hideMenu(); closeModal(); }
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); run(); }
    else if (e.key === 'F10') { e.preventDefault(); stepCmd('over'); }
    else if (e.key === 'F11' && e.shiftKey) { e.preventDefault(); stepCmd('out'); }
    else if (e.key === 'F11') { e.preventDefault(); stepCmd('into'); }
    else if (e.key === 'F5' && runnerActive()) { e.preventDefault(); stepCmd('continue'); }
  });
  window.addEventListener('beforeunload', saveProject);
  Store.load();
  const ids = Object.keys(Store.data.projects);
  if (Store.data.current && Store.data.projects[Store.data.current]) openProject(Store.data.current);
  else if (ids.length) openProject(ids[0]);
  else { ED = (navigator.language || 'en').toLowerCase().startsWith('es') ? 'es' : 'en'; loadExample(BL.SAMPLES.examples.find(e => e.id === 'grades')); }
  getDownloads();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
</script>
</body>
